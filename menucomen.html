    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        :root{--cream:#F5EFD6;--cream2:#FBF7E8;--ink:#35441A;--green:#4C6425;--green2:#5f7d2f;--gold:#c8a84b}
        html,body{font-family:'Poppins',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;margin:0}
        .brand-font{font-family:'Poppins',sans-serif;font-weight:800;letter-spacing:-.02em}
        .cart-overlay{position:fixed;inset:0;background:rgba(53,68,26,.35);z-index:150;opacity:0;pointer-events:none;transition:opacity .35s}
        .cart-overlay.active{opacity:1;pointer-events:auto}
        .modal{background:rgba(53,68,26,.35);backdrop-filter:blur(4px)}
        .modal-content{background:var(--cream2)}
        .category-card{transform:translateY(24px);opacity:0;transition:all .5s ease-out}
        .category-card.appear{transform:translateY(0);opacity:1}
        .cat-inner{background:var(--ink);border-radius:26px;transition:all .25s;height:100%;position:relative;overflow:hidden}
        .cat-inner::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.08),transparent 60%)}
        .category-card:hover .cat-inner{transform:translateY(-4px);box-shadow:0 18px 40px rgba(53,68,26,.35)}
        .cat-icon{color:var(--cream);transition:transform .25s}
        .category-card:hover .cat-icon{transform:scale(1.12)}
        #cart-panel{position:fixed;right:-440px;top:0;bottom:0;width:420px;max-width:100vw;background:var(--cream2);border-left:2px solid var(--ink);z-index:200;transition:right .4s cubic-bezier(.4,0,.2,1);overflow-y:auto;display:flex;flex-direction:column}
        #cart-panel.open{right:0}
        .qty-btn{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;line-height:1;transition:all .15s}
        .cart-badge{position:absolute;top:-8px;right:-8px;background:var(--ink);color:var(--cream);border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
        .item-row{border-bottom:1px solid rgba(53,68,26,.15)}
        .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--cream);padding:10px 22px;border-radius:99px;font-weight:600;font-size:.9rem;z-index:999;transition:transform .35s;pointer-events:none;box-shadow:0 8px 24px rgba(53,68,26,.4)}
        .toast.show{transform:translateX(-50%) translateY(0)}
        .price-pill{background:var(--ink);color:var(--cream);border-radius:99px;padding:2px 12px;font-weight:700;font-size:.95rem;white-space:nowrap}
        .add-btn{background:var(--ink);color:var(--cream);transition:transform .15s}.add-btn:hover{transform:scale(1.1)}
        .inp-c{background:#fff;border:1px solid rgba(53,68,26,.25);color:var(--ink)}
        .inp-c:focus{outline:none;border-color:var(--green)}
        .inp-c::placeholder{color:rgba(53,68,26,.4)}
    </style>
</head>
<body class="overflow-x-hidden">

<header class="fixed top-0 left-0 right-0 z-50" style="background:rgba(245,239,214,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(53,68,26,.15)">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-2 hover:opacity-70 transition-opacity" style="color:var(--ink)">
            <i class="fas fa-arrow-left text-2xl"></i>
            <span class="text-sm font-semibold tracking-wider hidden sm:block">INICIO</span>
        </a>
        <img src="log.png" alt="Le Smash" class="h-12 w-auto" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'brand-font text-2xl',textContent:'Le Smash',style:'color:var(--ink)'}))">
        <button onclick="openCart()" class="relative p-2" style="color:var(--ink)">
            <i class="fas fa-shopping-bag text-2xl"></i>
            <span id="cart-badge" class="cart-badge hidden">0</span>
        </button>
    </div>
</header>

<main class="pt-24 pb-16 px-4 sm:px-6 max-w-4xl mx-auto">
    <h1 class="brand-font text-6xl sm:text-7xl text-center mb-1" style="color:var(--ink)">Menú</h1>
    <p class="text-center mb-2 text-sm tracking-[.25em] uppercase" style="color:var(--green)">Smash Burgers</p>
    <p class="text-center mb-10 text-xs" style="color:rgba(53,68,26,.6)">🍟 Todas las burgers incluyen papas a la francesa tradicionales</p>
    <div id="mesa-top" class="hidden text-center mb-8"></div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5" id="categories"></div>
</main>

<div id="modal" class="modal fixed inset-0 z-50 hidden flex items-center justify-center p-4">
    <div class="modal-content rounded-3xl w-full max-w-2xl max-h-[92vh] overflow-y-auto relative shadow-2xl" style="border:2px solid var(--ink)">
        <button onclick="closeModal()" class="absolute top-4 right-4 text-5xl z-20 transition" style="color:var(--ink)">×</button>
        <div class="p-6 sm:p-10" id="modal-content"></div>
    </div>
</div>

<div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
<div id="cart-panel">
    <div class="p-5 flex items-center justify-between" style="border-bottom:1px solid rgba(53,68,26,.15)">
        <h2 class="brand-font text-2xl" style="color:var(--ink)">Tu Pedido</h2>
        <button onclick="closeCart()" class="text-3xl transition leading-none" style="color:var(--ink)">×</button>
    </div>
    <div class="px-5 py-4 space-y-3" style="border-bottom:1px solid rgba(53,68,26,.15)">
        <div id="mesa-banner" class="hidden rounded-xl px-4 py-3 flex items-center justify-between" style="background:var(--ink);color:var(--cream)">
            <span class="text-xs uppercase tracking-widest opacity-80">Tu mesa</span>
            <span id="mesa-label" class="brand-font text-2xl">—</span>
        </div>
        <div id="name-field">
            <label class="block text-xs uppercase tracking-widest mb-2" style="color:var(--green)">Nombre <span class="opacity-50 normal-case">(opcional)</span></label>
            <input id="table-input" type="text" placeholder="Tu nombre" class="inp-c w-full rounded-xl px-4 py-2 text-sm">
        </div>
        <div>
            <label id="phone-label" class="block text-xs uppercase tracking-widest mb-2" style="color:var(--green)">Celular <span class="opacity-50 normal-case">(opcional)</span></label>
            <input id="phone-input" type="tel" inputmode="numeric" placeholder="10 dígitos" class="inp-c w-full rounded-xl px-4 py-2 text-sm">
        </div>
    </div>
    <div id="cart-items" class="px-5 py-4 space-y-2 flex-1">
        <p class="text-center py-8 text-sm" style="color:rgba(53,68,26,.4)">Tu carrito está vacío</p>
    </div>
    <div class="px-5 pb-4 pt-4" style="border-top:1px solid rgba(53,68,26,.15)">
        <label class="block text-xs uppercase tracking-widest mb-2" style="color:var(--green)">Notas del pedido</label>
        <textarea id="order-notes" rows="2" placeholder="Sin cebolla, término, especificaciones..." class="inp-c w-full rounded-xl px-4 py-2 text-sm resize-none"></textarea>
    </div>
    <div class="px-5 pb-8 pt-2">
        <div class="flex justify-between items-center mb-4">
            <span class="text-sm" style="color:rgba(53,68,26,.7)">Total estimado</span>
            <span id="cart-total" class="text-2xl font-bold" style="color:var(--ink)">$0</span>
        </div>
        <button onclick="markTableReady()" id="mesa-lista-btn" class="hidden w-full py-3 rounded-2xl font-bold mb-3" style="background:var(--green);color:var(--cream)">
            <i class="fas fa-flag-checkered mr-2"></i>Mesa lista · ya ordenamos todo
        </button>
        <button onclick="sendOrder()" class="w-full py-4 rounded-2xl font-bold text-lg" style="background:var(--ink);color:var(--cream)">
            <i class="fas fa-paper-plane mr-2"></i>Enviar a cocina
        </button>
        <button onclick="clearCart()" class="w-full mt-3 py-2 text-sm transition-colors" style="color:rgba(53,68,26,.5)">Vaciar carrito</button>
    </div>
</div>

<button id="float-cart" onclick="openCart()" class="hidden fixed left-1/2 -translate-x-1/2 bottom-5 z-[250] items-center gap-2 font-bold px-5 py-3 rounded-full shadow-2xl hover:scale-105 transition-transform" style="background:var(--ink);color:var(--cream)">
    <i class="fas fa-shopping-bag"></i>
    <span id="float-cart-count">0</span>
    <span class="opacity-50">·</span>
    <span id="float-cart-total">$0</span>
    <span class="ml-1">Ver pedido →</span>
</button>

<!-- Pantalla completa de espera (en preparación / listo) -->
<div id="wait-screen" class="hidden fixed inset-0 z-[500] flex items-center justify-center p-6" style="background:var(--ink);color:var(--cream)">
  <div class="text-center max-w-md w-full">
    <div id="wait-icon" class="text-7xl mb-6">🍳</div>
    <h1 id="wait-title" class="brand-font text-4xl sm:text-5xl mb-3">Tu pedido está en preparación</h1>
    <p id="wait-sub" class="text-lg mb-6" style="color:rgba(245,239,214,.75)">La cocina está preparando tu orden.</p>
    <div id="wait-timer" class="hidden brand-font text-6xl mb-6"></div>
    <div id="wait-items" class="text-left inline-block mx-auto"></div>
    <p id="wait-mesa" class="mt-8 text-sm uppercase tracking-widest" style="color:rgba(245,239,214,.5)"></p>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let FIXED_TABLE=null;
window.addEventListener('DOMContentLoaded',function(){
  const p=new URLSearchParams(location.search);
  let mesa=(p.get('mesa')||p.get('table')||'').toString().trim();
  if(!mesa)return;
  const label=/^\d+$/.test(mesa)?('Mesa '+mesa):mesa;
  FIXED_TABLE=label;
  const b=document.getElementById('mesa-banner');if(b){b.classList.remove('hidden');}
  const ml=document.getElementById('mesa-label');if(ml)ml.textContent=label;
  const mt=document.getElementById('mesa-top');if(mt){mt.classList.remove('hidden');mt.innerHTML='<span style="background:var(--ink);color:var(--cream)" class="px-5 py-2 rounded-full text-sm font-semibold tracking-wide">🍽️ '+label+'</span>';}
  const back=document.querySelector('a[href="indexcomen.html"]');if(back)back.setAttribute('href','indexcomen.html?mesa='+encodeURIComponent(mesa));
  document.title=label+' · Le Smash';
  startTableWatch();
});

let MENU_DATA = {
  hamburguesas:[
    {name:"La Clásica",desc:"Doble carne smash, queso americano, cebolla caramelizada, pepinillos y salsa de la casa",price:140},
    {name:"Trufa y Parmesano",desc:"Doble smash, queso suizo, cebolla crispy, mayonesa de trufa y parmesano rallado",price:170},
    {name:"BBQ Brisket",desc:"Doble smash, brisket ahumado deshebrado, queso cheddar, cebolla crispy y salsa BBQ",price:185},
    {name:"Jalapeño Popper",desc:"Doble smash, queso cheddar, jalapeños tatemados, queso crema y tocino crujiente",price:165},
    {name:"Norteña",desc:"Doble smash, queso menonita, chile güero asado, cebolla caramelizada y alioli de ajo rostizado",price:185},
    {name:"Especialidad (Smash Tower)",desc:"Triple carne smash, triple queso americano, cebolla caramelizada, tocino, pepinillos y salsa secreta",price:210},
    {name:"Oshun",desc:"Camarón, crispy fries, cebolla caramelizada, aderezo de trufa y queso suizo",price:178}
  ],
  fries:[
    {name:"Dirty Fries (Francesas)",desc:"Papas tipo francesas, queso cheddar, tocino crujiente, cebollín y salsa especial",price:65},
    {name:"Truffle Cut (Criscut)",desc:"Papas tipo criscut, parmesano, aceite de trufa y perejil fresco",price:68},
    {name:"Volcano Fries (Tornillo)",desc:"Papas tipo tornillo, queso fundido, chile quebrado, tocino y aderezo chipotle",price:67}
  ]
};

let currentSec=null;
try{
  if(typeof db!=='undefined'&&db){
    db.ref('menu').on('value',s=>{
      const fb=s.val();
      if(fb&&typeof fb==='object'&&Object.keys(fb).length){
        const m={};
        Object.keys(fb).forEach(k=>{
          const arr=Array.isArray(fb[k])?fb[k]:Object.values(fb[k]||{});
          m[k]=arr.filter(Boolean).map(it=>{const o={name:it.name,price:+it.price||0,desc:it.desc||''};if(it.sizes){const sz=(Array.isArray(it.sizes)?it.sizes:Object.values(it.sizes)).filter(Boolean).map(z=>({label:z.label,price:+z.price||0}));if(sz.length)o.sizes=sz;}return o;});
        });
        Object.keys(m).forEach(k=>{MENU_DATA[k]=m[k];});
        const modal=document.getElementById('modal');
        if(currentSec&&modal&&!modal.classList.contains('hidden'))openModal(currentSec);
      }
    });
  }
}catch(e){console.warn('Menú en vivo no disponible:',e);}

const sections=[
    {id:"hamburguesas",title:"BURGERS",icon:"fa-burger"},
    {id:"fries",title:"FRIES",icon:"fa-fire-burner"}
];

const container=document.getElementById('categories');
sections.forEach((sec,index)=>{
    const card=document.createElement('button');
    card.className='category-card';
    card.innerHTML=`<div class="cat-inner flex flex-col items-center justify-center py-12 px-3 gap-3">
        <i class="fas ${sec.icon} cat-icon text-5xl"></i>
        <h2 class="brand-font text-3xl tracking-wide text-center" style="color:var(--cream)">${sec.title}</h2>
    </div>`;
    card.onclick=()=>openModal(sec);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('appear'),100+index*120);
});

function slugify(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'-');}
function ea(s){return (s||'').toString().replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

let MODAL={};
function renderItemControl(slug){
    const el=document.getElementById('ctrl-'+slug);
    const m=MODAL[slug];
    if(!el||!m)return;
    const key=m.name+'|'+(m.size||'');
    const ci=cart.find(i=>(i.name+'|'+(i.size||''))===key);
    const qty=ci?ci.qty:0;
    if(qty<=0){
        el.innerHTML=`<button class="add-btn w-9 h-9 rounded-full flex items-center justify-center font-bold text-xl" onclick="addToCart('${ea(m.name)}',${m.price},'${ea(m.desc)}','${ea(m.size||'')}')">+</button>`;
    }else{
        el.innerHTML=`<div class="flex items-center gap-2 rounded-full px-1 py-0.5" style="background:rgba(53,68,26,.1)">
            <button class="qty-btn" style="background:rgba(53,68,26,.15);color:var(--ink)" onclick="removeFromCart('${ea(m.name)}','${ea(m.size||'')}')">−</button>
            <span class="font-bold w-6 text-center" style="color:var(--ink)">${qty}</span>
            <button class="qty-btn add-btn" onclick="addToCart('${ea(m.name)}',${m.price},'${ea(m.desc)}','${ea(m.size||'')}')">+</button>
        </div>`;
    }
}
function refreshModalControls(){Object.keys(MODAL).forEach(renderItemControl);}

function openModal(sec){
    currentSec=sec;
    const modal=document.getElementById('modal');
    const content=document.getElementById('modal-content');
    const items=MENU_DATA[sec.id]||[];
    MODAL={};
    const sizeName=s=>s.label.split('$')[0].trim();
    let itemsHtml=items.map(item=>{
        const hasSizes=item.sizes&&item.sizes.length>0;
        const slug=slugify(item.name);
        const sizesHtml=hasSizes?`<div class="flex gap-2 mt-2 flex-wrap" id="sizes-${slug}">`+item.sizes.map((s,i)=>`<button class="size-btn ${i===0?'selected':''}" style="border:1px solid var(--green);border-radius:8px;padding:4px 12px;font-size:.78rem" onclick="selectSize('${slug}',${i},${s.price},'${ea(item.name)}','${ea(sizeName(s))}')">${s.label}</button>`).join('')+`</div>`:'';
        const displayPrice=hasSizes?item.sizes[0].price:item.price;
        const initSize=hasSizes?sizeName(item.sizes[0]):'';
        MODAL[slug]={name:item.name,desc:item.desc||'',price:displayPrice,size:initSize};
        return`<div class="flex justify-between items-start gap-4 pb-4" style="border-bottom:1px solid rgba(53,68,26,.15)"><div class="flex-1"><span class="font-bold block text-lg" style="color:var(--ink)">${item.name}</span>${item.desc?`<small class="block leading-snug mt-0.5" style="color:rgba(53,68,26,.65)">${item.desc}</small>`:''}${sizesHtml}</div><div class="flex items-center gap-3 flex-shrink-0"><span class="price-pill" id="price-${slug}">$${displayPrice}</span><div id="ctrl-${slug}"></div></div></div>`;
    }).join('');
    content.innerHTML=`<h2 class="brand-font text-4xl text-center mb-6" style="color:var(--ink)">${sec.title}</h2><div class="space-y-4">${itemsHtml}</div>`;
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    refreshModalControls();
}

window.selectSize=function(slug,idx,price,itemName,size){
    document.querySelectorAll(`#sizes-${slug} .size-btn`).forEach((b,i)=>{b.classList.toggle('selected',i===idx);b.style.background=i===idx?'var(--ink)':'transparent';b.style.color=i===idx?'var(--cream)':'var(--ink)';});
    document.getElementById(`price-${slug}`).textContent=`$${price}`;
    if(MODAL[slug]){MODAL[slug].size=size;MODAL[slug].price=price;}
    renderItemControl(slug);
};

function closeModal(){
    document.getElementById('modal').classList.add('hidden');
    document.getElementById('modal').classList.remove('flex');
}
document.addEventListener('keydown',e=>{if(e.key==="Escape")closeModal();});

// ==================== CARRITO ====================
let cart=[];
function cartKey(name,size){return name+'|'+(size||'');}

window.addToCart=function(name,price,desc,size){
    size=size||'';
    const existing=cart.find(i=>cartKey(i.name,i.size)===cartKey(name,size));
    if(existing)existing.qty++;
    else cart.push({name,price,desc,size,qty:1,note:''});
    updateCartUI();
    showToast(`+ ${name}${size?' ('+size+')':''}`);
};
window.removeFromCart=function(name,size){
    const idx=cart.findIndex(i=>cartKey(i.name,i.size)===cartKey(name,size||''));
    if(idx===-1)return;
    if(cart[idx].qty>1)cart[idx].qty--;
    else cart.splice(idx,1);
    updateCartUI();
};
function clearCart(){cart=[];updateCartUI();}

function updateCartUI(){
    const badge=document.getElementById('cart-badge');
    const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
    const count=cart.reduce((s,i)=>s+i.qty,0);
    badge.textContent=count;
    count>0?badge.classList.remove('hidden'):badge.classList.add('hidden');
    document.getElementById('cart-total').textContent=`$${total}`;
    const fc=document.getElementById('float-cart');
    const cartOpen=document.getElementById('cart-panel').classList.contains('open');
    if(count>0&&!cartOpen){fc.classList.remove('hidden');fc.classList.add('flex');}
    else{fc.classList.add('hidden');fc.classList.remove('flex');}
    document.getElementById('float-cart-count').textContent=count+' art.';
    document.getElementById('float-cart-total').textContent=`$${total}`;
    const el=document.getElementById('cart-items');
    if(cart.length===0){el.innerHTML=`<p class="text-center py-8 text-sm" style="color:rgba(53,68,26,.4)">Tu carrito está vacío</p>`;refreshModalControls();updateMesaListaBtn();return;}
    el.innerHTML=cart.map(item=>`<div class="item-row py-3">
      <div class="flex items-center justify-between gap-3">
        <div class="flex-1 min-w-0"><p class="text-sm font-medium truncate" style="color:var(--ink)">${item.name}${item.size?` <span style="color:rgba(53,68,26,.5)">(${item.size})</span>`:''}</p><p class="text-xs" style="color:var(--green)">$${item.price} c/u</p></div>
        <div class="flex items-center gap-2"><button class="qty-btn" style="background:rgba(53,68,26,.12);color:var(--ink)" onclick="removeFromCart('${ea(item.name)}','${ea(item.size||'')}')">−</button><span class="font-bold w-5 text-center text-sm" style="color:var(--ink)">${item.qty}</span><button class="qty-btn add-btn" onclick="addToCart('${ea(item.name)}',${item.price},'','${ea(item.size||'')}')">+</button></div>
        <span class="font-bold text-sm w-14 text-right" style="color:var(--ink)">$${item.price*item.qty}</span>
      </div>
      <input class="inp-c w-full rounded-lg px-3 py-1.5 text-xs mt-2" placeholder="📝 Nota para este platillo (ej. sin cebolla)" value="${(item.note||'').replace(/"/g,'&quot;')}" oninput="setItemNote('${ea(item.name)}','${ea(item.size||'')}',this.value)">
    </div>`).join('');
    refreshModalControls();updateMesaListaBtn();
}
window.setItemNote=function(name,size,val){
    const it=cart.find(i=>cartKey(i.name,i.size)===cartKey(name,size||''));
    if(it)it.note=val;
};
function updateMesaListaBtn(){
    const btn=document.getElementById('mesa-lista-btn');if(!btn)return;
    const show=!!FIXED_TABLE && !LOCKED && (cart.length>0 || (MY_ORDER && !MY_ORDER.tableReady));
    btn.classList.toggle('hidden',!show);
}

function openCart(){document.getElementById('cart-panel').classList.add('open');document.getElementById('cart-overlay').classList.add('active');document.getElementById('float-cart').classList.add('hidden');document.getElementById('float-cart').classList.remove('flex');}
function closeCart(){document.getElementById('cart-panel').classList.remove('open');document.getElementById('cart-overlay').classList.remove('active');updateCartUI();}

// ==================== PEDIDO + FLUJO DE MESA (Firebase) ====================
let MY_ORDER=null, WAIT_ORDER=null, LOCKED=false, _wasLocked=false, _prevWaitStatus='';
const tnorm=s=>(s||'').trim().toLowerCase();
function orderTotalC(items){return items.reduce((s,i)=>s+i.price*i.qty,0);}
function itemStateC(i){return i&&i.state?i.state:'pendiente';}
function allDeliveredC(o){const it=(o&&o.items)||[];return it.length>0&&it.every(i=>itemStateC(i)==='entregado');}

// Envía el carrito actual (crea o fusiona con el pedido activo que aún no marcó "mesa lista").
function submitCart(){
  if(cart.length===0)return Promise.resolve(null);
  if(typeof db==='undefined'||!db){showToast('⚠️ Falta configurar Firebase');return Promise.reject();}
  const cname=document.getElementById('table-input').value.trim();
  const table=FIXED_TABLE || cname;
  if(!table){showToast('Escribe tu nombre o abre el menú desde el QR de tu mesa 🙂');return Promise.reject();}
  const phone=document.getElementById('phone-input').value.trim();
  const newNotes=document.getElementById('order-notes').value.trim();
  const items=cart.map(i=>({name:i.name,price:i.price,qty:i.qty,size:i.size||'',note:i.note||''}));
  return db.ref('orders').once('value').then(snap=>{
    const all=snap.val()||{};
    const existing=Object.values(all).find(o=>o&&o.table&&tnorm(o.table)===tnorm(table)&&o.status!=='cobrado'&&o.status!=='cancelado'&&!o.tableReady&&!o.kitchenDone);
    if(existing){
      const merged=Array.isArray(existing.items)?existing.items.map(i=>({...i})):[];
      items.forEach(c=>{
        const f=merged.find(i=>cartKey(i.name,i.size)===cartKey(c.name,c.size)&&(i.note||'')===(c.note||''));
        if(f)f.qty+=c.qty; else merged.push({...c});
      });
      const notes=[existing.notes,newNotes].filter(Boolean).join(' | ');
      const upd={items:merged,total:orderTotalC(merged),status:'nuevo',notes};
      if(phone)upd.phone=phone;
      if(cname)upd.customerName=cname;
      return db.ref('orders/'+existing.id).update(upd).then(()=>existing.id);
    }else{
      const id=Date.now();
      const order={id,table,phone:phone||'',customerName:cname||'',notes:newNotes,items,total:orderTotalC(items),status:'nuevo',createdAt:new Date().toISOString()};
      return db.ref('orders/'+id).set(order).then(()=>id);
    }
  });
}

function sendOrder(){
  if(cart.length===0){showToast('Agrega algo primero 😊');return;}
  submitCart().then(id=>{
    if(!id)return;
    clearCart();
    document.getElementById('order-notes').value='';
    showToast('¡Enviado a cocina! 🍔');
  }).catch(err=>{if(err)console.error(err);});
}

// "Mesa lista": envía lo que quede en el carrito y marca el pedido como listo para preparar.
function markTableReady(){
  const cname=document.getElementById('table-input').value.trim();
  const table=FIXED_TABLE || cname;
  const finish=()=>{
    db.ref('orders').once('value').then(snap=>{
      const all=snap.val()||{};
      const target=Object.values(all).find(o=>o&&o.table&&tnorm(o.table)===tnorm(table)&&o.status!=='cobrado'&&o.status!=='cancelado'&&!o.tableReady&&!o.kitchenDone);
      if(!target){showToast('Primero envía tu pedido 🙂');return;}
      db.ref('orders/'+target.id).update({tableReady:true,tableReadyAt:new Date().toISOString()}).then(()=>{
        clearCart();document.getElementById('order-notes').value='';closeCart();
        showToast('¡Mesa lista! La cocina ya fue avisada ✅');
      });
    });
  };
  if(cart.length>0){ submitCart().then(()=>finish()).catch(()=>{}); }
  else finish();
}

// Escucha en tiempo real los pedidos de esta mesa para bloquear/mostrar la pantalla de espera.
function startTableWatch(){
  if(typeof db==='undefined'||!db||!FIXED_TABLE)return;
  db.ref('orders').on('value',snap=>{
    const all=snap.val()||{};
    const mine=Object.values(all).filter(o=>o&&o.table&&tnorm(o.table)===tnorm(FIXED_TABLE)&&o.status!=='cancelado').sort((a,b)=>(b.id||0)-(a.id||0));
    MY_ORDER=mine[0]||null;
    WAIT_ORDER=mine.find(o=>o.tableReady&&!o.kitchenDone&&!allDeliveredC(o))||null;
    LOCKED=!!WAIT_ORDER;
    applyLockState();
  });
}
function applyLockState(){
  const ws=document.getElementById('wait-screen');
  if(LOCKED&&WAIT_ORDER){ws.classList.remove('hidden');renderWaitScreen();}
  else ws.classList.add('hidden');
  if(!LOCKED&&_wasLocked){showToast('¡Todo entregado! Ya puedes ordenar de nuevo 🙌');_prevWaitStatus='';}
  _wasLocked=LOCKED;
  updateMesaListaBtn();
}
function renderWaitScreen(){
  const o=WAIT_ORDER;if(!o)return;
  const items=o.items||[];
  const hayListos=items.some(i=>itemStateC(i)==='listo');
  const preparando=o.status==='preparando';
  const state=hayListos?'listo':(preparando?'preparando':'espera');
  if(state!==_prevWaitStatus){try{navigator.vibrate&&navigator.vibrate([120,60,120]);}catch(e){}_prevWaitStatus=state;}
  const icon=document.getElementById('wait-icon'),title=document.getElementById('wait-title'),sub=document.getElementById('wait-sub'),timer=document.getElementById('wait-timer');
  document.getElementById('wait-mesa').textContent=FIXED_TABLE||'';
  if(state==='espera'){icon.textContent='✅';title.textContent='¡Mesa lista!';sub.textContent='La cocina va a preparar tu orden en breve.';timer.classList.add('hidden');}
  else if(state==='preparando'){icon.textContent='🍳';title.textContent='Tu pedido está en preparación';sub.textContent='Estamos cocinando tu orden. Tiempo estimado:';timer.classList.remove('hidden');updateCountdown();}
  else{icon.textContent='🔔';title.textContent='¡Tu orden está lista!';sub.textContent='Puedes pasar a recoger:';timer.classList.add('hidden');}
  document.getElementById('wait-items').innerHTML=items.map(i=>{
    const st=itemStateC(i);
    const badge=st==='entregado'?'<span style="opacity:.5">✓ entregado</span>':st==='listo'?'<span style="color:#ffe08a;font-weight:700">🔔 pasa a recoger</span>':'<span style="opacity:.7">⏳ en preparación</span>';
    return `<div class="flex items-center justify-between gap-6 py-1.5 text-base border-b" style="border-color:rgba(245,239,214,.15)"><span>${i.qty}× ${i.name}</span> ${badge}</div>`;
  }).join('');
}
function updateCountdown(){
  const o=WAIT_ORDER,timer=document.getElementById('wait-timer');
  if(!o||o.status!=='preparando'||!o.prepStartedAt||!o.prepMinutes||!timer)return;
  const end=new Date(o.prepStartedAt).getTime()+(+o.prepMinutes)*60000;
  const rem=Math.max(0,Math.floor((end-Date.now())/1000));
  const mm=Math.floor(rem/60),ss=rem%60;
  timer.textContent=rem>0?`${mm}:${String(ss).padStart(2,'0')}`:'¡Ya casi!';
}
setInterval(()=>{if(LOCKED&&WAIT_ORDER&&WAIT_ORDER.status==='preparando')updateCountdown();},1000);

function showToast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg;t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
